<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TABS風 ボクセル物理バトルシミュレーター</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <!-- 上部 HUD: 両軍ステータス・開始ボタン -->
    <header class="top-hud">
      <div id="red-stats" class="team-panel red"></div>

      <div class="center-panel">
        <div id="phase-badge" class="phase-badge placement">配置フェーズ</div>
        <div class="main-actions">
          <button id="btn-start" class="start-btn">⚔ 戦闘開始 (Space)</button>
          <button id="btn-clear" class="ctrl-btn danger">全消去</button>
          <button id="btn-mute" class="ctrl-btn">🔊 SE: ON</button>
        </div>
      </div>

      <div id="blue-stats" class="team-panel blue"></div>
    </header>

    <!-- 左上: プリセット & カメラ・速度操作 -->
    <aside class="side-panel">
      <div class="panel-section">
        <div class="section-label">プリセット編成</div>
        <div id="preset-buttons" class="btn-group"></div>
      </div>
      <div class="panel-section">
        <div class="section-label">ゲーム速度</div>
        <div id="speed-buttons" class="btn-group"></div>
      </div>
      <div class="panel-section">
        <div class="section-label">視点・操作ヘルプ</div>
        <button id="btn-cam-reset" class="ctrl-btn full">視点リセット</button>
        <ul class="help-list">
          <li><b>左クリック:</b> ユニット配置（左=赤 / 右=青）</li>
          <li><b>右クリック:</b> ユニット削除</li>
          <li><b>右ドラッグ / 中ドラッグ:</b> カメラ回転</li>
          <li><b>WASD / 矢印キー:</b> カメラ移動、<b>ホイール:</b> ズーム</li>
          <li><b>1〜5 キー:</b> 兵種切替、<b>Space:</b> 戦闘開始/戻る</li>
        </ul>
      </div>
    </aside>

    <!-- 勝敗リザルトバナー -->
    <div id="result-banner" class="result-banner hidden">
      <div id="result-title" class="result-title">赤軍の勝利！</div>
      <div id="result-sub" class="result-sub"></div>
      <button id="btn-retry" class="start-btn">↺ 配置に戻る</button>
    </div>

    <!-- 下部: カテゴリタブ & 兵種パレット -->
    <footer class="bottom-hud">
      <div id="category-tabs" class="category-tabs"></div>
      <div id="unit-bar" class="unit-bar"></div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
