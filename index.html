<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>TABS風 ボクセル物理バトルシミュレーター</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>

    <!-- 全UI非表示時の復帰ボタン -->
    <button id="btn-restore-hud" class="restore-hud-btn hidden" title="UIを再表示する">
      👁 UI表示
    </button>

    <!-- 上部 HUD: 両軍ステータス・開始ボタン -->
    <header id="top-hud" class="top-hud">
      <div id="red-stats" class="team-panel red"></div>

      <div class="center-panel">
        <div id="phase-badge" class="phase-badge placement">配置フェーズ</div>
        <div class="main-actions">
          <button id="btn-toggle-panel" class="ctrl-btn mode-toggle-btn active" title="ゲームモード・ステージ選択パネルの表示/非表示 (Tab)">
            ☰ モードUI
          </button>
          <button id="btn-start" class="start-btn">⚔ 戦闘開始 (Space)</button>
          <button id="btn-touch-erase" class="ctrl-btn" title="タップでユニットを削除するモードに切り替えます">
            🗑 削除
          </button>
          <button id="btn-clear" class="ctrl-btn danger" title="配置したユニットを全消去">全消去</button>
          <button id="btn-mute" class="ctrl-btn" title="効果音のON/OFF">🔊 SE</button>
          <button id="btn-toggle-hud" class="ctrl-btn" title="すべてのUIを非表示にして画面を広く使います (H)">
            👁 UI隠す
          </button>
        </div>
      </div>

      <div id="blue-stats" class="team-panel blue"></div>
    </header>

    <!-- 左上: モード切替・ステージ/プリセット選択・速度操作 -->
    <aside id="side-panel" class="side-panel">
      <div class="side-panel-header">
        <span class="side-panel-title">🎮 ゲームモード・設定</span>
        <button id="btn-close-panel" class="panel-close-btn" title="このパネルを非表示にして戦場を広く表示します">
          ✕ パネルを隠す
        </button>
      </div>

      <div class="panel-section">
        <div class="section-label">ゲームモード</div>
        <div class="mode-switch-group">
          <button id="btn-mode-arcade" class="ctrl-btn active">🏆 アーケード (10面)</button>
          <button id="btn-mode-sandbox" class="ctrl-btn">🛠 サンドボックス</button>
        </div>
      </div>

      <!-- アーケードモード用パネル -->
      <div id="arcade-panel" class="panel-section">
        <div class="section-header-row">
          <div class="section-label">ステージ選択 (1〜10面)</div>
          <button id="btn-unlock-all" class="mini-link-btn" title="全兵種・全ステージを解放／通常進行に戻す">🔓 全解放</button>
        </div>
        <div id="stage-buttons" class="stage-grid"></div>
        <div id="stage-briefing" class="stage-briefing"></div>
      </div>

      <!-- サンドボックス用プリセットパネル -->
      <div id="sandbox-panel" class="panel-section hidden">
        <div class="section-label">プリセット編成</div>
        <div id="preset-buttons" class="btn-group"></div>
      </div>

      <div class="panel-section">
        <div class="section-label">ゲーム速度</div>
        <div id="speed-buttons" class="btn-group"></div>
      </div>
      <div class="panel-section">
        <div class="section-label">視点・操作ヘルプ</div>
        <button id="btn-cam-reset" class="ctrl-btn full">🎥 視点リセット</button>
        <ul class="help-list">
          <li><b>タップ / 左クリック:</b> ユニット配置（🗑削除ON時は削除）</li>
          <li><b>ドラッグ / 右ドラッグ:</b> カメラ回転、<b>ピンチ / ホイール:</b> ズーム</li>
          <li><b>右クリック:</b> ユニット削除、<b>WASD / 矢印:</b> カメラ移動</li>
          <li><b>1〜9 キー:</b> 兵種切替、<b>Space:</b> 戦闘開始、<b>Tab / H:</b> UI開閉</li>
        </ul>
      </div>
    </aside>

    <!-- 勝敗リザルトバナー -->
    <div id="result-banner" class="result-banner hidden">
      <div id="result-stars" class="result-stars hidden"></div>
      <div id="result-title" class="result-title">赤軍の勝利！</div>
      <div id="result-sub" class="result-sub"></div>
      <div id="result-unlock" class="result-unlock hidden"></div>
      <div class="result-actions">
        <button id="btn-retry" class="ctrl-btn">↺ 配置に戻る</button>
        <button id="btn-next-stage" class="start-btn hidden">▶ 次の面へ進む</button>
      </div>
    </div>

    <!-- 下部: カテゴリタブ & 兵種パレット & ユニット詳細説明オーバーレイ -->
    <footer id="bottom-hud" class="bottom-hud">
      <!-- ユニット選択時の詳細説明オーバーレイ -->
      <div id="unit-detail-overlay" class="unit-detail-overlay hidden" role="region" aria-label="ユニット詳細情報">
        <div class="unit-detail-main">
          <div id="detail-avatar" class="unit-detail-avatar"></div>
          <div class="unit-detail-body">
            <div class="unit-detail-header-row">
              <div class="unit-detail-title-line">
                <span id="detail-name" class="unit-detail-name"></span>
                <span id="detail-cat-badge" class="unit-cat-badge"></span>
                <span id="detail-featured-tag" class="unit-featured-tag hidden">★特効</span>
              </div>
              <button id="btn-close-detail" class="unit-detail-close-btn" title="詳細説明を閉じる" aria-label="詳細説明を閉じる">✕</button>
            </div>
            <div id="detail-stats-row" class="unit-detail-stats-row"></div>
            <div id="detail-desc" class="unit-detail-desc"></div>
            <div id="detail-featured-note" class="unit-detail-featured-note hidden"></div>
          </div>
        </div>
      </div>

      <div class="bottom-hud-top-row">
        <div id="category-tabs" class="category-tabs"></div>
        <button id="btn-toggle-detail" class="detail-toggle-btn active" title="ユニット詳細説明の表示/非表示">
          ℹ️ 詳細
        </button>
        <button id="btn-toggle-unitbar" class="unitbar-collapse-btn" title="兵種パレットを折りたたむ／展開する">
          ▼ 兵種バー
        </button>
      </div>
      <div id="unit-bar" class="unit-bar"></div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
